version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      - backend
    networks:
      - kocaeli-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9561:9561"
    volumes:
      - ./backend/public:/app/public
    depends_on:
      - mysql
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=kocaeli2024!
      - DB_NAME=kocaeli_db
    networks:
      - kocaeli-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - kocaeli_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_ROOT_PASSWORD=kocaeli2024!
      - MYSQL_DATABASE=kocaeli_db
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - kocaeli-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "9068:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=kocaeli2024!
    depends_on:
      - mysql
    networks:
      - kocaeli-network

networks:
  kocaeli-network:
    driver: bridge

volumes:
  kocaeli_mysql_data: